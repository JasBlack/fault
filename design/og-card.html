<!doctype html>
<!-- Link-preview card (1200 × 630). Rendered to public/og.jpg; see design/README.md. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url('../src/fonts/archivo-800.ttf');font-weight:800}
@font-face{font-family:'IBM Plex Mono';src:url('../src/fonts/ibm-plex-mono-500.ttf');font-weight:500}
@font-face{font-family:'IBM Plex Mono';src:url('../src/fonts/ibm-plex-mono-600.ttf');font-weight:600}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#0b0b0c;color:#e4e4e1;font-family:'IBM Plex Mono',monospace}
body:before{content:'';position:absolute;inset:0;background:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px) 0 0/24px 24px}
.hero{position:absolute;right:0;top:0;width:640px;height:630px;background:url('og-hero.jpg') center/cover}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0c 0%,#0b0b0cd9 14%,#0b0b0c00 46%)}
.copy{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;gap:30px;z-index:1}
h1{margin:0;font:800 104px/1 Archivo,sans-serif;letter-spacing:.2em;display:flex;align-items:center;gap:6px}
.led{width:16px;height:16px;border-radius:50%;background:#39ff88;box-shadow:0 0 14px #39ff88;margin-left:4px}.led.off{background:#3a3d44;box-shadow:none;margin-left:10px}
p{margin:0;font-size:29px;line-height:1.45;color:#e4e4e1;max-width:520px}
.chips{display:flex;gap:12px}.chips span{border:1.5px solid #303135;border-radius:7px;padding:5px 13px;font-size:20px;color:#929399}
.url{font-weight:600;font-size:27px;color:#39ff88}
</style></head><body>
<div class="hero"></div>
<div class="copy">
  <h1>FAULT<i class="led"></i><i class="led off"></i></h1>
  <p>bend pictures and video through a broken circuit</p>
  <div class="chips"><span>picture</span><span>gif</span><span>video</span><span>record 1080p</span></div>
  <div class="url">fault.jas.black</div>
</div>
</body></html>
